[defaults]
# Menunjuk langsung ke lokasi file inventory yang baru saja kita buat
inventory = ./inventory/hosts.ini

# Mematikan prompt konfirmasi SSH (StrictHostKeyChecking)
host_key_checking = False

# Mencegah Ansible membuat file .retry yang mengotori folder jika terjadi error
retry_files_enabled = False

# Menyembunyikan peringatan sistem agar output terminal tetap bersih
deprecation_warnings = False

# (Opsional) Mengatur waktu tunggu koneksi SSH menjadi lebih lama (dalam detik)
timeout = 30