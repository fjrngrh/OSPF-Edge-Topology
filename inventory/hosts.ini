[routers]
R1 ansible_host=192.168.122.55
R2 ansible_host=192.168.122.48
R3 ansible_host=192.168.122.11

[routers:vars]
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli
ansible_user=admin
ansible_password=cisco
ansible_become=yes
ansible_become_method=enable
ansible_become_password=cisco

# Parameter untuk mengatasi SSH Key Exchange legacy pada Cisco IOS
ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa'